name: Actualizar último programa

# Sin trigger de "schedule" a propósito: el cron nativo de GitHub Actions
# se estaba saltando corridas sin motivo. Ahora un Cron Trigger de Cloudflare
# Workers (más confiable) llama a este workflow_dispatch cada 30 min.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/actualizar-ultimo-programa.mjs

      - name: Commit y push si hay un programa nuevo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ultimo-programa.json
          git diff --staged --quiet || (git commit -m "Actualizar último programa" && git push)
