name: Limpiar noticias antiguas

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/limpiar-noticias.mjs

      - name: Commit y push si se eliminó algo
        run: |
          git config user.name "koncevision-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/noticias
          git diff --staged --quiet || (git commit -m "Limpiar noticias antiguas" && git push)
